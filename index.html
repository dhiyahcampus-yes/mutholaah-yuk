<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Muthola’ah Yuk!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 {
      text-align: center;
      color: #1f2937;
    }
    .arab {
      font-size: 26px;
      text-align: center;
      direction: rtl;
      margin: 20px 0;
      line-height: 1.8;
    }
    .arti {
      text-align: center;
      color: #374151;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>📖 Muthola’ah Yuk!</h1>

    <div class="arab">
      أَبْدَأُ بِالْحَمْدِ مُصَلِّيًا عَلَىٰ  
      مُحَمَّدٍ خَيْرِ نَبِيٍّ أُرْسِلَا
    </div>

    <div class="arti">
      Aku memulai dengan memuji Allah dan bershalawat kepada Muhammad,
      Nabi terbaik yang diutus.
    </div>
  </div>

</body>
</html>
